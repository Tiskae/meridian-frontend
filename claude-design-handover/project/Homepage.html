<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Motors — A Considered Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: #f6f5f2;
    font-family: 'Manrope', sans-serif;
    color: #0a0a09;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: #0a0a09; color: #f6f5f2; }

  @keyframes kenBurns {
    from { transform: scale(1); }
    to   { transform: scale(1.05); }
  }
  @keyframes marqueeScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-33.333%); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="InventoryPage.jsx"></script>
<script type="text/babel" src="VehicleDetail.jsx"></script>

<script type="text/babel">
const App = () => {
  const [page, setPage] = React.useState('home');
  const [selectedVehicle, setSelectedVehicle] = React.useState(null);

  const navigate = (target) => {
    setPage(target);
    window.scrollTo(0, 0);
  };

  const handleViewCollection = () => navigate('inventory');
  const handleViewVehicle = (v) => {
    setSelectedVehicle(v);
    navigate('detail');
  };
  const handleBackToInventory = () => navigate('inventory');
  const handleNav = (key) => {
    if (key === 'home') navigate('home');
    else if (key === 'inventory') navigate('inventory');
  };

  return (
    <div>
      <Nav currentPage={page === 'home' ? 'home' : page === 'inventory' || page === 'detail' ? 'inventory' : ''} onNavigate={handleNav} />
      {page === 'home' && (
        <>
          <Hero onViewCollection={handleViewCollection} />
          <Marquee />
          <FeaturedGrid onViewVehicle={handleViewVehicle} />
          <ProcessSection />
          <Testimonial />
          <ClosingCTA />
          <Footer />
        </>
      )}
      {page === 'inventory' && (
        <>
          <InventoryPage onViewVehicle={handleViewVehicle} />
          <ClosingCTA />
          <Footer />
        </>
      )}
      {page === 'detail' && selectedVehicle && (
        <>
          <VehicleDetail vehicle={selectedVehicle} onBack={handleBackToInventory} />
          <ClosingCTA />
          <Footer />
        </>
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
