<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Motors — UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f6f5f2; font-family: 'Manrope', sans-serif; }
  @keyframes kenBurns { from { transform: scale(1); } to { transform: scale(1.05); } }
  @keyframes revealUp {
    from { opacity: 0; transform: translateY(24px); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  .reveal { animation: revealUp 800ms cubic-bezier(0.16,1,0.3,1) both; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="FeaturedGrid.jsx"></script>
<script type="text/babel" src="ProcessSection.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="InventoryPage.jsx"></script>

<script type="text/babel">
// ─── Vehicle Detail Page ───────────────────────────────────────────────────

const VehicleDetail = ({ vehicle, onBack }) => {
  const specs = [
    ['Make', vehicle.make],
    ['Model', vehicle.model],
    ['Year', vehicle.stamp.split('·')[0].trim()],
    ['Engine', '4.0L Biturbo V8'],
    ['Power', '585 bhp'],
    ['Transmission', '9-Speed AMG Speedshift'],
    ['Mileage', vehicle.mileage || '12,400 km'],
    ['Colour', 'Obsidian Black Metallic'],
    ['Condition', 'Pre-owned, Excellent'],
    ['Stock No.', 'MM-2024-0041'],
  ];

  return (
    <div style={{background:'#f6f5f2', minHeight:'100vh'}}>
      {/* Header strip */}
      <div style={{padding:'32px 80px 0', display:'flex', justifyContent:'space-between', alignItems:'baseline'}}>
        <div>
          <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'10px', letterSpacing:'0.2em', textTransform:'uppercase', color:'#706b5d', marginBottom:'6px'}}>
            Stock No. MM-2024-0041 · Pre-owned
          </div>
          <h1 style={{fontFamily:"'Instrument Serif',Georgia,serif", fontSize:'clamp(32px,4vw,52px)', color:'#0a0a09', lineHeight:1.05, letterSpacing:'-0.02em'}}>
            {vehicle.make} <em style={{fontStyle:'italic'}}>{vehicle.model}</em>
          </h1>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'9px', letterSpacing:'0.18em', textTransform:'uppercase', color:'#706b5d', marginBottom:'4px'}}>Price</div>
          <div style={{fontFamily:"'Instrument Serif',Georgia,serif", fontSize:'28px', color:'#0a0a09'}}>{vehicle.price}</div>
        </div>
      </div>

      {/* Asymmetric image grid */}
      <div style={{padding:'32px 80px', display:'grid', gridTemplateColumns:'2fr 1fr', gridTemplateRows:'320px 160px', gap:'8px'}}>
        <div style={{...vdStyles.imgBlock, background: vehicle.bg, gridRow:'1/3'}}>
          <span style={vdStyles.imgPlaceholder}>Primary Photography</span>
        </div>
        <div style={{...vdStyles.imgBlock, background:'linear-gradient(160deg,#a29d8c,#706b5d)'}}>
          <span style={vdStyles.imgPlaceholder}>Interior</span>
        </div>
        <div style={{...vdStyles.imgBlock, background:'linear-gradient(160deg,#706b5d,#3f3c34)'}}>
          <span style={vdStyles.imgPlaceholder}>Detail</span>
        </div>
      </div>

      {/* Main content — specs + CTAs */}
      <div style={{padding:'0 80px 80px', display:'grid', gridTemplateColumns:'1fr 320px', gap:'64px', alignItems:'start'}}>
        <div>
          {/* Highlight blockquote */}
          <blockquote style={{fontFamily:"'Instrument Serif',Georgia,serif", fontSize:'22px', fontStyle:'italic', color:'#3f3c34', lineHeight:1.4, margin:'40px 0', paddingLeft:'24px', borderLeft:'1px solid rgba(201,197,184,0.5)'}}>
            "The G-Class defines the category it created. This example — finished in Obsidian Black, with the full AMG package — is presented in genuinely exceptional order."
          </blockquote>

          {/* Specs */}
          <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'10px', letterSpacing:'0.2em', textTransform:'uppercase', color:'#706b5d', marginBottom:'16px'}}>— Specifications</div>
          <div style={{display:'flex', flexDirection:'column', gap:'0'}}>
            {specs.map(([k, v]) => (
              <div key={k} style={{display:'flex', gap:'12px', padding:'11px 0', borderBottom:'1px solid rgba(201,197,184,0.4)', alignItems:'baseline'}}>
                <span style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'10px', letterSpacing:'0.18em', textTransform:'uppercase', color:'#706b5d', minWidth:'120px'}}>{k}</span>
                <span style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'10px', color:'#a29d8c'}}>—</span>
                <span style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'10px', letterSpacing:'0.12em', textTransform:'uppercase', color:'#0a0a09'}}>{v}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Sticky CTA rail */}
        <div style={{position:'sticky', top:'88px', display:'flex', flexDirection:'column', gap:'12px', paddingTop:'40px'}}>
          <button style={vdStyles.ctaPrimary}>Enquire on WhatsApp</button>
          <button style={vdStyles.ctaSecondary}>Book a Test Drive</button>
          <button style={vdStyles.ctaSecondary}>Request Inspection Report</button>
          <div style={{height:'1px', background:'rgba(201,197,184,0.4)', margin:'8px 0'}}></div>
          <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'9px', letterSpacing:'0.18em', textTransform:'uppercase', color:'#706b5d', lineHeight:1.7}}>
            Listed fourteen days ago<br />
            By appointment at our showroom<br />
            No. 4 Kofo Abayomi St, V.I.
          </div>
        </div>
      </div>
      <button onClick={onBack} style={{margin:'0 80px 40px', fontFamily:"'JetBrains Mono',monospace", fontSize:'10px', letterSpacing:'0.2em', textTransform:'uppercase', background:'transparent', border:'none', color:'#706b5d', cursor:'pointer', textDecoration:'underline'}}>← Back to Inventory</button>
    </div>
  );
};

const vdStyles = {
  imgBlock: { display:'flex', alignItems:'center', justifyContent:'center' },
  imgPlaceholder: { fontFamily:"'JetBrains Mono',monospace", fontSize:'9px', letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(246,245,242,0.35)' },
  ctaPrimary: { fontFamily:"'JetBrains Mono',monospace", fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', background:'#0a0a09', color:'#f6f5f2', padding:'15px', border:'none', cursor:'pointer', borderRadius:0, transition:'transform 500ms cubic-bezier(0.16,1,0.3,1)', width:'100%' },
  ctaSecondary: { fontFamily:"'JetBrains Mono',monospace", fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', background:'transparent', color:'#0a0a09', padding:'15px', border:'1px solid #0a0a09', cursor:'pointer', borderRadius:0, transition:'transform 500ms cubic-bezier(0.16,1,0.3,1)', width:'100%' },
};

// ─── Brand Marquee ─────────────────────────────────────────────────────────
const Marquee = () => {
  const brands = ['Mercedes-Benz', 'Porsche', 'Range Rover', 'Lexus', 'BMW', 'Rolls-Royce', 'Bentley', 'Lamborghini', 'Ferrari', 'Aston Martin'];
  return (
    <div style={{background:'#f6f5f2', borderTop:'1px solid rgba(201,197,184,0.4)', borderBottom:'1px solid rgba(201,197,184,0.4)', overflow:'hidden', padding:'20px 0'}}>
      <div style={{display:'flex', gap:'48px', animation:'marqueeScroll 24s linear infinite', whiteSpace:'nowrap'}}>
        {[...brands,...brands].map((b,i) => (
          <span key={i} style={{fontFamily:"'Instrument Serif',Georgia,serif", fontStyle:'italic', fontSize:'22px', color:'#c9c5b8', flexShrink:0}}>{b}</span>
        ))}
      </div>
      <style>{`@keyframes marqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }`}</style>
    </div>
  );
};

// ─── Closing CTA (dark) ────────────────────────────────────────────────────
const ClosingCTA = () => (
  <section style={{background:'#0a0a09', padding:'120px 80px', display:'flex', justifyContent:'space-between', alignItems:'flex-end'}}>
    <div>
      <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'10px', letterSpacing:'0.2em', textTransform:'uppercase', color:'#a29d8c', marginBottom:'20px'}}>By Appointment</div>
      <h2 style={{fontFamily:"'Instrument Serif',Georgia,serif", fontSize:'clamp(36px,5vw,64px)', color:'#f6f5f2', lineHeight:1.08, letterSpacing:'-0.02em', maxWidth:'520px'}}>
        Visit us. See the cars<br />as they deserve to be <em style={{fontStyle:'italic'}}>seen</em>.
      </h2>
    </div>
    <div style={{display:'flex', flexDirection:'column', gap:'12px', alignItems:'flex-end'}}>
      <button style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', background:'#f6f5f2', color:'#0a0a09', padding:'14px 28px', border:'none', cursor:'pointer', borderRadius:0}}>Book a Private Viewing</button>
      <button style={{fontFamily:"'JetBrains Mono',monospace", fontSize:'11px', letterSpacing:'0.2em', textTransform:'uppercase', background:'transparent', color:'#f6f5f2', padding:'14px 28px', border:'1px solid rgba(246,245,242,0.3)', cursor:'pointer', borderRadius:0}}>Enquire on WhatsApp</button>
    </div>
  </section>
);

// ─── App Shell ─────────────────────────────────────────────────────────────
const App = () => {
  const [page, setPage] = React.useState('home');
  const [selectedVehicle, setSelectedVehicle] = React.useState(null);

  const handleViewVehicle = (v) => { setSelectedVehicle(v); setPage('detail'); };
  const handleViewCollection = () => setPage('inventory');
  const handleBack = () => { setPage('inventory'); setSelectedVehicle(null); };

  return (
    <div>
      <Nav currentPage={page} />
      {page === 'home' && (
        <>
          <Hero onViewCollection={handleViewCollection} />
          <Marquee />
          <FeaturedGrid onViewVehicle={handleViewVehicle} />
          <ProcessSection />
          <Testimonial />
          <ClosingCTA />
          <Footer />
        </>
      )}
      {page === 'inventory' && (
        <>
          <InventoryPage onViewVehicle={handleViewVehicle} />
          <Footer />
        </>
      )}
      {page === 'detail' && selectedVehicle && (
        <>
          <VehicleDetail vehicle={selectedVehicle} onBack={handleBack} />
          <Footer />
        </>
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
